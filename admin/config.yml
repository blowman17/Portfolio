backend:
  name: github
  repo: blowman17/Portfolio
  branch: main
  base_url: https://decap-cms-oauth-pkce.netlify.app
  auth_endpoint: auth

local_backend: true

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "portfolio_content"
    label: "Portfolio Management"
    files:
      - name: "projects_file"
        label: "Engineering Projects List"
        file: "content/projects.json"
        description: "Add, edit, or remove engineering projects and case study details"
        fields:
          - name: "projects"
            label: "Projects List"
            widget: "list"
            summary: "{{fields.title}} ({{fields.role}})"
            fields:
              - { name: "id", label: "Project ID (e.g. stockflow)", widget: "string" }
              - { name: "title", label: "Project Title", widget: "string" }
              - { name: "role", label: "Role / Badge Label", widget: "string" }
              - { name: "summary", label: "Short Summary", widget: "text" }
              - { name: "githubUrl", label: "GitHub Repo URL", widget: "string", required: false }
              - { name: "liveUrl", label: "Live System URL", widget: "string", required: false }
              - name: "visualStats"
                label: "Visual Metrics (Side Box)"
                widget: "list"
                fields:
                  - { name: "label", label: "Label (e.g. Database)", widget: "string" }
                  - { name: "val", label: "Value (e.g. PostgreSQL)", widget: "string" }
              - name: "features"
                label: "Case Study Highlights"
                widget: "list"
                field: { name: "feature", label: "Highlight Description", widget: "string" }

      - name: "designs_file"
        label: "Graphic Design Showcase List"
        file: "content/designs.json"
        description: "Add, edit, or remove visual design flyer slides in the carousel"
        fields:
          - name: "designs"
            label: "Graphic Designs List"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { name: "id", label: "Design ID", widget: "string" }
              - { name: "badgeOverlay", label: "Image Badge Overlay (e.g. EVENT POSTER)", widget: "string" }
              - { name: "badge", label: "Category Badge Label", widget: "string" }
              - { name: "title", label: "Design Title", widget: "string" }
              - { name: "description", label: "Description", widget: "text" }
              - { name: "image", label: "Flyer Image Upload", widget: "image" }
